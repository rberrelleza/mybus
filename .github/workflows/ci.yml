name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Validate skill package JSON
        run: |
          for f in skill-package/skill.json skill-package/interactionModels/custom/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done
      - name: Build container image
        run: docker build -t mybus .
