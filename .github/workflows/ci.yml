name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Validate skill package JSON
        run: |
          for f in skill-package/skill.json skill-package/interactionModels/custom/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done

  # Deploys main to AWS Lambda using GitHub OIDC (no AWS keys stored in GitHub).
  # Skipped until the AWS_DEPLOY_ROLE_ARN repository variable is set; see
  # README.md "Deploy with GitHub Actions" for the one-time AWS setup.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token AWS trusts
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'mybus' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -trimpath -ldflags="-s -w" -o bootstrap .
          zip -j mybus.zip bootstrap
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://mybus.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
